name: Build Flet APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils ninja-build cmake build-essential

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Setup Android Environment
        run: |
          yes | flutter doctor --android-licenses || true
          flutter config --no-analytics
          flutter config --enable-android
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0"

      - name: Install Compatible Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.21.2" serious-python

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          CI: "true"
        run: |
          flet build apk -v

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sierra-APK
          path: |
            build/apk/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk

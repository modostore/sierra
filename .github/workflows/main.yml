name: Build Flet APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            mesa-utils \
            ninja-build \
            cmake \
            build-essential \
            libssl-dev \
            libffi-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libncurses5-dev \
            libgdbm-dev \
            tk-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Setup Android Environment
        run: |
          yes | flutter doctor --android-licenses || true
          flutter config --no-analytics
          flutter config --enable-android

      - name: Install Compatible Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.21.2"

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.22.3-x64/flutter
          PATH: /opt/hostedtoolcache/flutter/stable-3.22.3-x64/flutter/bin:/opt/hostedtoolcache/flutter/stable-3.22.3-x64/flutter/bin/cache/dart-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CI: "true"
        run: |
          flet build apk -v

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sierra-APK
          path: |
            build/apk/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk
